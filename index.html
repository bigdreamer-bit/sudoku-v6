<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f7fb">
<title>Sudoku V6</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172235;--muted:#718096;--blue:#1769e0;--line:#cbd5e1;--heavy:#526174;--peer:#f0f5fb;--same:#e5efff;--sel:#cde2ff;--bad:#ffe1e6;--good:#e5f8ec}
[data-theme=dark]{--bg:#0c1420;--card:#121e2d;--ink:#edf5ff;--muted:#91a2b7;--blue:#65a3ff;--line:#34465a;--heavy:#8294a9;--peer:#18283a;--same:#203a58;--sel:#28598d;--bad:#552533;--good:#173b2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,input{font:inherit;touch-action:manipulation}
.app{max-width:620px;margin:auto;padding:10px}.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.logo{font-size:27px;font-weight:950}.v{font-size:10px;color:var(--muted)}
.iconrow{display:flex;gap:5px}.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:17px}
.hero{background:linear-gradient(135deg,#1769e0,#7048e8);color:#fff;border-radius:24px;padding:23px;margin-bottom:11px;box-shadow:0 15px 42px #24509a2a}.hero h1{font-size:30px;margin:0 0 6px}.hero p{margin:0;opacity:.86;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:101px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:16px;text-align:left}.tile b{display:block;font-size:17px;margin-bottom:5px}.tile span{font-size:11px;color:var(--muted)}.tile.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.tile.primary span{color:#eef5ff}
.label{font-size:12px;color:var(--muted);font-weight:900;margin:15px 0 6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:center;padding:11px 4px}.stat b{font-size:20px;display:block}.stat small{color:var(--muted)}
.gamehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.link{border:0;background:none;color:var(--blue);font-weight:900}.chips{display:flex;gap:4px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 7px;font-size:10px;font-weight:850}
.boardbox{padding:5px;background:var(--card);border-radius:14px;box-shadow:0 8px 26px #0001}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);border:2.5px solid var(--heavy);border-radius:6px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);font-size:clamp(19px,7.1vw,34px);font-weight:760;min-width:0}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.br{border-right:2.5px solid var(--heavy)}.bb{border-bottom:2.5px solid var(--heavy)}.given{font-weight:950}.user{color:var(--blue)}.peer{background:var(--peer)}.same{background:var(--same)}.sel{background:var(--sel)!important}.bad{background:var(--bad)!important;color:#e83e59!important}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(6px,2.15vw,11px);color:var(--muted)}.notes span{display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:8px}.num{height:48px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--blue);font-size:22px;font-weight:950;position:relative}.num small{position:absolute;right:4px;top:2px;font-size:9px;color:var(--muted)}.num.done{opacity:.25}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}.actions button{height:43px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:10px;font-weight:850}.actions .on{background:var(--blue);color:white}.msg{text-align:center;height:25px;padding-top:6px;color:var(--muted);font-size:12px;font-weight:800}
.sheet{position:fixed;inset:0;z-index:20;background:#07111fb0;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}.modal{max-height:86dvh;overflow:auto;width:min(100%,550px);background:var(--card);color:var(--ink);border-radius:25px;padding:22px;box-shadow:0 25px 70px #0005}.modal h2{margin:0 0 7px;font-size:26px}.modal p{color:var(--muted);line-height:1.55}.big{width:100%;height:47px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:900;font-size:15px}
.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.setting small{display:block;color:var(--muted);margin-top:2px}.switch{width:50px;height:29px;border:0;border-radius:99px;background:#aeb9c7;padding:3px}.switch i{display:block;width:23px;height:23px;border-radius:50%;background:#fff;transition:.18s}.switch.on{background:var(--blue)}.switch.on i{transform:translateX(21px)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.day{text-align:center;padding:8px 2px;border-radius:9px;font-size:11px;background:var(--bg)}.day.done{background:var(--good);font-weight:900;color:#23804a}.day.today{outline:2px solid var(--blue)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}.rowstat{margin:12px 0}.rowstat div{display:flex;justify-content:space-between;font-size:12px}
.hintbox{background:var(--bg);border-radius:15px;padding:14px;margin:12px 0}.hintbox b{color:var(--blue)}
@media(max-height:720px){.app{padding-top:4px}.num{height:39px}.actions button{height:35px}.msg{height:18px;padding-top:2px}}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Sudoku V6">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="app">
<section id="home">
 <div class="top"><div class="logo">SUDOKU <span class="v">V6</span></div><div class="iconrow"><button class="iconbtn" id="statsBtn">▥</button><button class="iconbtn" id="settingsBtn">⚙</button></div></div>
 <div class="hero"><h1>每天一點推理</h1><p>每日挑戰、智慧提示與完整個人紀錄。</p></div>
 <div class="grid2">
  <button class="tile primary" id="continue"><b>▶ 繼續遊戲</b><span id="continueText">開始新的數獨</span></button>
  <button class="tile" id="daily"><b>📅 每日挑戰</b><span id="dailyText">今天尚未完成</span></button>
  <button class="tile" id="new"><b>＋ 新遊戲</b><span>四種難度</span></button>
  <button class="tile" id="calendarBtn"><b>🗓 挑戰月曆</b><span>查看本月完成紀錄</span></button>
 </div>
 <div class="label">本機紀錄</div>
 <div class="stats"><div class="stat"><b id="wins">0</b><small>完成</small></div><div class="stat"><b id="streak">0</b><small>連勝</small></div><div class="stat"><b id="best">--:--</b><small>最佳</small></div></div>
</section>

<section id="game" class="hidden">
 <div class="gamehead"><button class="link" id="back">‹ 首頁</button><div class="chips"><div class="chip" id="mode">中等</div><div class="chip">⏱ <span id="clock">00:00</span></div><div class="chip">❌ <span id="err">0</span><span id="limit">/3</span></div></div></div>
 <div class="boardbox"><div class="board" id="board"></div></div>
 <div class="pad" id="pad"></div>
 <div class="actions"><button id="undo">↶<br>復原</button><button id="erase">⌫<br>清除</button><button id="note">✎<br>筆記</button><button id="auto">✦<br>候選數</button><button id="hint">💡<br>提示</button></div>
 <div class="msg" id="msg">點空格，再選擇數字。</div>
</section>
</div>

<div class="sheet hidden" id="difficulty"><div class="modal"><h2>選擇難度</h2><p>所有題目都會檢查唯一解。</p><div class="grid2"><button class="tile" data-d="easy"><b>簡單</b><span>輕鬆開始</span></button><button class="tile" data-d="medium"><b>中等</b><span>標準挑戰</span></button><button class="tile" data-d="hard"><b>困難</b><span>更多推理</span></button><button class="tile" data-d="expert"><b>專家</b><span>進階挑戰</span></button></div></div></div>

<div class="sheet hidden" id="settings"><div class="modal"><h2>⚙ 遊戲設定</h2>
 <div class="setting"><div><b>深色模式</b><small>降低夜間畫面亮度</small></div><button class="switch" id="darkSwitch"><i></i></button></div>
 <div class="setting"><div><b>錯誤 3 次結束</b><small>關閉後可不限次數嘗試</small></div><button class="switch on" id="mistakeSwitch"><i></i></button></div>
 <div class="setting"><div><b>音效</b><small>輸入正確或錯誤時播放</small></div><button class="switch on" id="soundSwitch"><i></i></button></div>
 <div class="setting"><div><b>震動回饋</b><small>裝置支援時使用</small></div><button class="switch on" id="vibrateSwitch"><i></i></button></div><br>
 <button class="big" id="closeSettings">完成</button>
</div></div>

<div class="sheet hidden" id="calendarSheet"><div class="modal"><h2>🗓 每日挑戰</h2><p id="monthTitle"></p><div class="calendar" id="calendar"></div><br><button class="big" id="closeCalendar">關閉</button></div></div>

<div class="sheet hidden" id="statsSheet"><div class="modal"><h2>▥ 遊戲統計</h2><div id="statsBody"></div><br><button class="big" id="closeStats">關閉</button></div></div>

<div class="sheet hidden" id="hintSheet"><div class="modal"><h2>💡 智慧提示</h2><div class="hintbox" id="hintExplain"></div><button class="big" id="applyHint">填入這一格</button></div></div>

<div class="sheet hidden" id="finish"><div class="modal"><h2 id="finishTitle"></h2><p id="finishText"></p><button class="big" id="finishBtn">回到首頁</button></div></div>

<script>
"use strict";
const $=x=>document.getElementById(x);
let sol=[],giv=[],val=[],notes=[],sel=-1,errors=0,secs=0,noteMode=false,ended=false,dailyMode=false,diff="medium",timer=null,history=[],hintIndex=-1;
let settings=JSON.parse(localStorage.getItem("sdk6settings")||'{"dark":false,"limit":true,"sound":true,"vibrate":true}');
const todayKey=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
function beep(f=500,d=.05){if(!settings.sound)return;try{let A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function buzz(n=20){if(settings.vibrate&&navigator.vibrate)navigator.vibrate(n)}
function sh(a,r=Math.random){for(let i=a.length-1;i;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rng(seed){let x=seed|0;return()=>{x=(x*1664525+1013904223)|0;return(x>>>0)/4294967296}}
function build(r=Math.random){let b=[0,1,2],g=sh([0,1,2],r),rows=g.flatMap(x=>sh([...b],r).map(y=>x*3+y));g=sh([0,1,2],r);let cols=g.flatMap(x=>sh([...b],r).map(y=>x*3+y)),nums=sh([1,2,3,4,5,6,7,8,9],r);return rows.flatMap(x=>cols.map(y=>nums[(x*3+Math.floor(x/3)+y)%9]))}
function cand(g,p){if(g[p])return[];let r=Math.floor(p/9),c=p%9,s=new Set();for(let i=0;i<9;i++){s.add(g[r*9+i]);s.add(g[i*9+c])}let R=Math.floor(r/3)*3,C=Math.floor(c/3)*3;for(let y=R;y<R+3;y++)for(let x=C;x<C+3;x++)s.add(g[y*9+x]);return[1,2,3,4,5,6,7,8,9].filter(n=>!s.has(n))}
function count(g,lim=2){let p=-1,cs=null;for(let i=0;i<81;i++)if(!g[i]){let q=cand(g,i);if(!q.length)return 0;if(cs===null||q.length<cs.length){p=i;cs=q;if(q.length===1)break}}if(p<0)return 1;let n=0;for(let q of cs){g[p]=q;n+=count(g,lim-n);g[p]=0;if(n>=lim)return n}return n}
function carve(s,d,r=Math.random){let target={easy:37,medium:46,hard:51,expert:54}[d],p=[...s],ids=sh([...Array(81).keys()],r),n=0;for(let i of ids){if(n>=target)break;let old=p[i];p[i]=0;if(count([...p],2)===1)n++;else p[i]=old}return p}
function save(){if(!ended)localStorage.setItem("sdk5save",JSON.stringify({sol,giv,val,notes:notes.map(s=>[...s]),errors,secs,dailyMode,diff}))}
function load(){try{let d=JSON.parse(localStorage.getItem("sdk5save"));if(!d||d.sol.length!==81)return false;sol=d.sol;giv=d.giv;val=d.val;notes=d.notes.map(a=>new Set(a));errors=d.errors;secs=d.secs;dailyMode=d.dailyMode;diff=d.diff;sel=-1;ended=false;history=[];return true}catch(e){return false}}
function begin(d="medium",daily=false){clearInterval(timer);diff=d;dailyMode=daily;let R=Math.random;if(daily){let k=todayKey().replaceAll("-","");R=rng(+k);diff="medium"}sol=build(R);giv=carve(sol,diff,R);val=[...giv];notes=Array.from({length:81},()=>new Set());sel=-1;errors=0;secs=0;noteMode=false;ended=false;history=[];showGame();$("err").textContent=0;clock();draw();run();save()}
function run(){clearInterval(timer);timer=setInterval(()=>{if(!ended){secs++;clock();if(secs%5===0)save()}},1000)}
function clock(){$("clock").textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0")}
function showGame(){$("home").classList.add("hidden");$("game").classList.remove("hidden");$("mode").textContent=dailyMode?"每日":({easy:"簡單",medium:"中等",hard:"困難",expert:"專家"}[diff]);$("limit").textContent=settings.limit?"/3":""}
function goHome(){save();clearInterval(timer);$("game").classList.add("hidden");$("home").classList.remove("hidden");refreshHome()}
function snap(){history.push({val:[...val],notes:notes.map(s=>[...s]),errors});if(history.length>50)history.shift()}
function draw(){let B=$("board");B.innerHTML="";for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,e=document.createElement("div");e.className="cell";if(c===2||c===5)e.classList.add("br");if(r===2||r===5)e.classList.add("bb");if(giv[i])e.classList.add("given");else if(val[i])e.classList.add("user");if(i===sel)e.classList.add("sel");if(sel>=0){let sr=Math.floor(sel/9),sc=sel%9;if(i!==sel&&(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))))e.classList.add("peer");if(val[sel]&&i!==sel&&val[i]===val[sel])e.classList.add("same")}if(val[i]&&!giv[i]&&val[i]!==sol[i])e.classList.add("bad");if(val[i])e.textContent=val[i];else if(notes[i].size){let n=document.createElement("div");n.className="notes";for(let k=1;k<=9;k++){let x=document.createElement("span");x.textContent=notes[i].has(k)?k:"";n.appendChild(x)}e.appendChild(n)}e.onclick=()=>{if(!ended){sel=i;draw()}};B.appendChild(e)}updatePad()}
function updatePad(){document.querySelectorAll(".num").forEach((b,j)=>{let left=9-val.filter(v=>v===j+1).length;b.querySelector("small").textContent=left;b.classList.toggle("done",left<=0)})}
function clearMarks(i,n){let r=Math.floor(i/9),c=i%9;for(let j=0;j<81;j++){let rr=Math.floor(j/9),cc=j%9;if(rr===r||cc===c||(Math.floor(rr/3)===Math.floor(r/3)&&Math.floor(cc/3)===Math.floor(c/3)))notes[j].delete(n)}}
function enter(n){if(sel<0||giv[sel]||ended)return;snap();if(noteMode){if(!val[sel])notes[sel].has(n)?notes[sel].delete(n):notes[sel].add(n);draw();save();return}val[sel]=n;notes[sel].clear();if(n!==sol[sel]){errors++;$("err").textContent=errors;beep(180,.08);buzz(40);$("msg").textContent="這個數字不正確";if(settings.limit&&errors>=3){finishGame(false);return}}else{clearMarks(sel,n);beep(650,.04);buzz(12);$("msg").textContent="正確"}draw();save();if(val.every((v,i)=>v===sol[i]))finishGame(true)}
function undo(){if(!history.length||ended)return;let h=history.pop();val=h.val;notes=h.notes.map(a=>new Set(a));errors=h.errors;$("err").textContent=errors;draw();save()}
function erase(){if(sel>=0&&!giv[sel]&&!ended){snap();val[sel]=0;notes[sel].clear();draw();save()}}
function autoCandidates(){snap();for(let i=0;i<81;i++)if(!val[i])notes[i]=new Set(cand(val,i));draw();save();$("msg").textContent="已自動填入目前可用候選數"}
function smartHint(){let empties=[...Array(81).keys()].filter(i=>!giv[i]&&val[i]!==sol[i]);if(!empties.length)return;let singles=empties.filter(i=>!val[i]&&cand(val,i).length===1);hintIndex=singles.length?singles[0]:empties[0];let r=Math.floor(hintIndex/9)+1,c=hintIndex%9+1,cs=cand(val,hintIndex);let reason=cs.length===1?`第 ${r} 列第 ${c} 欄目前只有 <b>${cs[0]}</b> 一個合法候選數。同行、同列與同九宮格中的其他數字已排除了其餘可能。`:`第 ${r} 列第 ${c} 欄的正確答案是 <b>${sol[hintIndex]}</b>。這格目前${cs.length?`可考慮候選數 ${cs.join("、")}；`:"有衝突，"}建議先檢查同行、同列與同九宮格已出現的數字。`;$("hintExplain").innerHTML=reason;$("hintSheet").classList.remove("hidden")}
function applyHint(){if(hintIndex<0)return;snap();sel=hintIndex;val[sel]=sol[sel];notes[sel].clear();clearMarks(sel,val[sel]);$("hintSheet").classList.add("hidden");draw();save();if(val.every((v,i)=>v===sol[i]))finishGame(true)}
function finishGame(win){ended=true;clearInterval(timer);localStorage.removeItem("sdk5save");let w=+(localStorage.getItem("sdk5wins")||0),s=+(localStorage.getItem("sdk5streak")||0);if(win){w++;s++;localStorage.setItem("sdk5wins",w);localStorage.setItem("sdk5streak",s);localStorage.setItem("sdk5games_"+diff,+(localStorage.getItem("sdk5games_"+diff)||0)+1);let key="sdk5best_"+diff,b=+(localStorage.getItem(key)||0);if(!b||secs<b)localStorage.setItem(key,secs);if(dailyMode){let done=JSON.parse(localStorage.getItem("sdk5daily")||"[]");if(!done.includes(todayKey()))done.push(todayKey());localStorage.setItem("sdk5daily",JSON.stringify(done))}beep(820,.12);buzz(80)}else localStorage.setItem("sdk5streak",0);$("finishTitle").textContent=win?"🎉 完成！":"挑戰結束";$("finishText").textContent=win?`完成時間 ${$("clock").textContent}，錯誤 ${errors} 次。`:"已達錯誤上限。";$("finish").classList.remove("hidden")}
function refreshHome(){let w=+(localStorage.getItem("sdk5wins")||0),s=+(localStorage.getItem("sdk5streak")||0);$("wins").textContent=w;$("streak").textContent=s;$("continueText").textContent=localStorage.getItem("sdk5save")?"繼續上次未完成的遊戲":"開始新的數獨";let done=JSON.parse(localStorage.getItem("sdk5daily")||"[]");$("dailyText").textContent=done.includes(todayKey())?"今日已完成 ✓":"今天尚未完成";let bs=["easy","medium","hard","expert"].map(d=>+(localStorage.getItem("sdk5best_"+d)||0)).filter(Boolean);$("best").textContent=bs.length?fmt(Math.min(...bs)):"--:--"}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function showCalendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),done=JSON.parse(localStorage.getItem("sdk5daily")||"[]");$("monthTitle").textContent=`${y} 年 ${m+1} 月`;$("calendar").innerHTML=["日","一","二","三","四","五","六"].map(x=>`<div class="day"><b>${x}</b></div>`).join("")+"<div></div>".repeat(first)+[...Array(days)].map((_,i)=>{let k=`${y}-${String(m+1).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`,cl="day"+(done.includes(k)?" done":"")+(k===todayKey()?" today":"");return `<div class="${cl}">${i+1}${done.includes(k)?" ✓":""}</div>`}).join("");$("calendarSheet").classList.remove("hidden")}
function showStats(){let w=+(localStorage.getItem("sdk5wins")||0);let names={easy:"簡單",medium:"中等",hard:"困難",expert:"專家"};let body=`<p>累積完成 <b>${w}</b> 局</p>`;for(let d of ["easy","medium","hard","expert"]){let n=+(localStorage.getItem("sdk5games_"+d)||0),b=+(localStorage.getItem("sdk5best_"+d)||0),pct=w?Math.round(n/w*100):0;body+=`<div class="rowstat"><div><b>${names[d]}</b><span>${n} 局｜最佳 ${b?fmt(b):"--:--"}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}$("statsBody").innerHTML=body;$("statsSheet").classList.remove("hidden")}
function syncSettings(){document.documentElement.dataset.theme=settings.dark?"dark":"";$("darkSwitch").classList.toggle("on",settings.dark);$("mistakeSwitch").classList.toggle("on",settings.limit);$("soundSwitch").classList.toggle("on",settings.sound);$("vibrateSwitch").classList.toggle("on",settings.vibrate);localStorage.setItem("sdk6settings",JSON.stringify(settings));$("limit").textContent=settings.limit?"/3":""}
for(let n=1;n<=9;n++){let b=document.createElement("button");b.className="num";b.innerHTML=`${n}<small>9</small>`;b.onclick=()=>enter(n);$("pad").appendChild(b)}
$("new").onclick=()=>$("difficulty").classList.remove("hidden");document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{$("difficulty").classList.add("hidden");begin(b.dataset.d,false)});
$("continue").onclick=()=>{if(load()){showGame();$("err").textContent=errors;clock();draw();run()}else $("difficulty").classList.remove("hidden")};$("daily").onclick=()=>begin("medium",true);$("back").onclick=goHome;
$("undo").onclick=undo;$("erase").onclick=erase;$("auto").onclick=autoCandidates;$("hint").onclick=smartHint;$("applyHint").onclick=applyHint;$("note").onclick=()=>{noteMode=!noteMode;$("note").classList.toggle("on",noteMode)};
$("settingsBtn").onclick=()=>$("settings").classList.remove("hidden");$("closeSettings").onclick=()=>$("settings").classList.add("hidden");$("calendarBtn").onclick=showCalendar;$("closeCalendar").onclick=()=>$("calendarSheet").classList.add("hidden");$("statsBtn").onclick=showStats;$("closeStats").onclick=()=>$("statsSheet").classList.add("hidden");
$("darkSwitch").onclick=()=>{settings.dark=!settings.dark;syncSettings()};$("mistakeSwitch").onclick=()=>{settings.limit=!settings.limit;syncSettings()};$("soundSwitch").onclick=()=>{settings.sound=!settings.sound;syncSettings()};$("vibrateSwitch").onclick=()=>{settings.vibrate=!settings.vibrate;syncSettings()};
$("finishBtn").onclick=()=>{$("finish").classList.add("hidden");goHome()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!ended)save()});
syncSettings();refreshHome();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
